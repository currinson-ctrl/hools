name: Agregar noticias (RSS -> cola de revisión)

on:
  push:
    branches: [claude/hoolsbrand-blog-aggregator-tlykwh]
    paths: [.github/workflows/aggregate.yml]
  # Sin horario: el rastreo se dispara a mano. Lo normal es hacerlo desde el
  # botón "Buscar noticias ahora" del dashboard, que es donde luego se revisa
  # la cola; este workflow se queda como vía alternativa, ejecutándose solo
  # cuando se pulsa "Run workflow" aquí en Actions.
  #
  # Antes corría cada 3 horas ("0 */3 * * *"), y llenaba la cola hubiera o no
  # alguien para revisarla. Si algún día se quiere recuperar, basta con
  # devolver el bloque schedule:
  #
  #   schedule:
  #     - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de agregación
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/fetch")
          echo "HTTP status: $status"
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "El endpoint de agregación devolvió un error"
            exit 1
          fi
